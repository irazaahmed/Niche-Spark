<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      width: 1280px; height: 800px; overflow: hidden; display: grid; grid-template-columns: 1fr 420px; align-items: center; gap: 40px; padding: 0 110px;
      background: radial-gradient(circle at 85% 0%, #0f5c46 0%, transparent 55%), linear-gradient(135deg, #12201c, #0d2a22);
      color: #f3f2ec; font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .copy { display: grid; gap: 22px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand img { width: 56px; height: 56px; }
    .brand span { font: 700 40px Georgia, serif; }
    h1 { font: 700 46px/1.1 Georgia, serif; }
    h1 em { color: #34d399; }
    ul { list-style: none; padding: 0; display: grid; gap: 12px; font-size: 19px; color: #c9d6d1; }
    li::before { content: '✓  '; color: #34d399; font-weight: 700; }
    .frame { width: 392px; border-radius: 16px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5); background: #fff; }
    .frame iframe { display: block; width: 392px; height: 720px; border: 0; }
  </style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="/__logo.svg" alt="" /><span>NicheSpark</span></div>
    <h1>Start research<br /><em>in one click</em></h1>
    <ul>
      <li>A to Z, prefix, suffix and template methods</li>
      <li>Pause, resume and retry failed queries</li>
      <li>Progress saved after every query</li>
      <li>Everything stays in your browser</li>
    </ul>
  </div>
  <div class="frame"><iframe src="/popup.html" title="NicheSpark popup"></iframe></div>
</body>
</html>
