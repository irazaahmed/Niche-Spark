# Netlify deploys the static website in site/ (no build step needed).
[build]
  publish = "site"
  command = ""

[[redirects]]
  from = "https://www.nichespark.tech/*"
  to = "https://nichespark.tech/:splat"
  status = 301
  force = true

# The niche article was rewritten for the "niche keyword research" cluster.
[[redirects]]
  from = "/blog/find-a-niche-with-google-autocomplete"
  to = "/blog/niche-keyword-research/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/find-a-niche-with-google-autocomplete/*"
  to = "/blog/niche-keyword-research/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-H2aXN8Qxo7tpc9yNA0DO8XhO60cbKgw0QRZu5CIu7Hk='; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Auth bridge for the extension (netlify/functions/auth.mjs, served at /api/auth/*).
[functions]
  directory = "netlify/functions"

# The password reset page and its links must not be indexed or cached.
[[headers]]
  for = "/reset-password/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

# Admin panel: never indexed or cached.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
