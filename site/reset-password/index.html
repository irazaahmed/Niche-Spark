<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset your password | NicheSpark</title>
  <meta name="description" content="Choose a new password for your NicheSpark account." />
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://nichespark.tech/reset-password/" />
  <meta name="theme-color" content="#047857" />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/logo-32.png" />
  <script>(function(){try{var t=localStorage.getItem('ns-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="page-legal">
  <header class="site-header">
    <nav class="container nav" aria-label="Main">
      <a class="logo" href="/" aria-label="NicheSpark home">
        <img class="logo-mark" src="/assets/logo.svg" alt="" width="30" height="30" />
        NicheSpark
      </a>
      <div class="nav-end">
        <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Switch to dark theme">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <a class="btn btn-sm" href="/">← Back to home</a>
      </div>
    </nav>
  </header>

  <main class="prose" id="main">
    <h1>Reset your password</h1>
    <p id="reset-intro">Choose a new password for your NicheSpark account.</p>
    <form id="reset-form" class="reset-form" novalidate>
      <label for="new-password">New password</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
      <p class="small">At least 8 characters.</p>
      <button class="btn btn-primary" type="submit" id="reset-submit">Save new password</button>
    </form>
    <p id="reset-message" role="status" aria-live="polite"></p>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <p class="small">© 2026 NicheSpark. Not affiliated with or endorsed by Google.</p>
      <ul class="footer-links">
        <li><a href="/">Home</a></li>
        <li><a href="/blog/">Blog</a></li>

      </ul>
    </div>
  </footer>
  <script src="/main.js" defer></script>
  <script src="/reset-password/reset.js" defer></script>
</body>
</html>
